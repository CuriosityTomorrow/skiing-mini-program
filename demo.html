<html lang="zh-CN">
<head>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      background: #F5F5F5;
      max-width: 480px;
      margin: 0 auto;
      min-height: 100vh;
    }

    .phone-frame {
      background: white;
      min-height: 100vh;
      position: relative;
      padding-bottom: 80px;
    }

    /* 导航栏 */
    .nav-bar {
      background: linear-gradient(135deg, #1E88E5 0%, #1565C0 100%);
      padding: 16px 20px;
      color: white;
      text-align: center;
      font-size: 18px;
      font-weight: 500;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    /* 搜索区域 */
    .search-section {
      background: white;
      padding: 16px 20px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    }

    .search-box {
      display: flex;
      align-items: center;
      background: #F5F5F5;
      border-radius: 24px;
      padding: 12px 20px;
    }

    .search-icon {
      margin-right: 10px;
      font-size: 16px;
    }

    .search-input {
      border: none;
      background: transparent;
      flex: 1;
      font-size: 15px;
      outline: none;
    }

    /* 筛选标签 */
    .filter-tags {
      display: flex;
      padding: 12px 20px;
      gap: 12px;
      background: white;
      border-bottom: 1px solid #F0F0F0;
    }

    .filter-tag {
      padding: 8px 20px;
      background: #F5F5F5;
      border-radius: 20px;
      font-size: 13px;
      color: #666;
      cursor: pointer;
      border: none;
      transition: all 0.3s;
    }

    .filter-tag.active {
      background: #1E88E5;
      color: white;
    }

    /* 状态提示 */
    .status-bar {
      padding: 12px 20px;
      background: #E8F5E9;
      font-size: 13px;
      color: #2E7D32;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    /* 滑雪场卡片 */
    .resort-card {
      background: white;
      margin: 16px 20px;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 2px 12px rgba(0, 0, 0, 0.08);
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .resort-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.12);
    }

    .resort-image {
      width: 100%;
      height: 200px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      position: relative;
    }

    .resort-type-badge {
      position: absolute;
      top: 12px;
      left: 12px;
      padding: 6px 16px;
      border-radius: 16px;
      font-size: 11px;
      color: white;
      font-weight: 500;
    }

    .badge-indoor {
      background: rgba(33, 150, 243, 0.9);
    }

    .badge-outdoor {
      background: rgba(76, 175, 80, 0.9);
    }

    .resort-rank {
      position: absolute;
      bottom: 12px;
      right: 12px;
      padding: 6px 12px;
      border-radius: 12px;
      background: rgba(255, 193, 7, 0.95);
      color: #333;
      font-size: 12px;
      font-weight: 600;
    }

    .resort-info {
      padding: 16px;
    }

    .resort-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 10px;
    }

    .resort-name {
      font-size: 17px;
      font-weight: bold;
      color: #333;
      flex: 1;
    }

    .resort-location {
      font-size: 12px;
      color: #9E9E9E;
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .resort-meta {
      display: flex;
      gap: 12px;
      font-size: 12px;
      color: #666;
      margin-bottom: 10px;
    }

    .meta-item {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .resort-stats {
      display: flex;
      justify-content: space-around;
      background: #F9F9F9;
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 10px;
    }

    .stat-item {
      text-align: center;
    }

    .stat-value {
      display: block;
      font-size: 16px;
      font-weight: 600;
      color: #1E88E5;
    }

    .stat-label {
      font-size: 11px;
      color: #9E9E9E;
      margin-top: 2px;
    }

    .resort-price {
      display: flex;
      align-items: baseline;
      margin-top: 10px;
    }

    .price-value {
      font-size: 22px;
      color: #F44336;
      font-weight: bold;
    }

    .price-unit {
      font-size: 12px;
      color: #9E9E9E;
      margin-left: 4px;
    }

    .favorite-btn {
      margin-left: auto;
      padding: 8px 16px;
      background: #F5F5F5;
      border: none;
      border-radius: 20px;
      font-size: 12px;
      color: #666;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 4px;
      transition: all 0.3s;
    }

    .favorite-btn.active {
      background: #FFEBEE;
      color: #C62828;
    }

    /* 空状态 */
    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: #9E9E9E;
    }

    .empty-icon {
      font-size: 64px;
      margin-bottom: 16px;
    }

    /* 加载状态 */
    .loading {
      text-align: center;
      padding: 40px 20px;
      color: #666;
    }

    .loading-spinner {
      display: inline-block;
      width: 40px;
      height: 40px;
      border: 3px solid #F5F5F5;
      border-top-color: #1E88E5;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* 详情弹窗 */
    .modal-overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.5);
      z-index: 1000;
      overflow-y: auto;

    .modal-content {

    </div>

      🏂 国内热门滑雪场
    </div>

    <!-- 详情弹窗 -->

      <div class="modal-content">
        <div class="modal-header">
          <button class="modal-close" onclick="closeModal()">×</button>

  <script>
    // ========================================
    // 领域层 - 实体和值对象
    // ========================================

    /**
     * 位置值对象
     */
    class Location {
      constructor(country, province, city, address, coordinates) {
        this.country = country;
        this.province = province;
        this.city = city;
        this.address = address;
        this.coordinates = coordinates; // { lat, lng }
      }

      get fullName() {
        return `${this.country} ${this.province} ${this.city}`;
      }
    }

    /**
     * 价格值对象
     */
    class Price {
      constructor(min, max, unit) {
        this.min = min;
        this.max = max;
        this.unit = unit; // '天' | '4小时' | '次'
      }

      get displayText() {
        if (this.min === this.max) {
          return `¥${this.min}/${this.unit}`;
        }
        return `¥${this.min}-${this.max}/${this.unit}`;
      }
    }

    /**
     * 设施值对象
     */
    class Facilities {
      constructor(trails, elevation, lifts) {
        this.trails = trails; // { total, beginner, intermediate, advanced }
        this.elevation = elevation; // { min, max, drop }
        this.lifts = lifts;
      }

      get trailDistribution() {
        const { total, beginner, intermediate, advanced } = this.trails;
        if (total === 0) return '暂无数据';
        return `初级${beginner}条 中级${intermediate}条 高级${advanced}条`;
      }
    }

    /**
     * 社交信息值对象
     */
    class SocialInfo {
      constructor(popularityScore, favoriteCount, shareCount, rating) {
        this.popularityScore = popularityScore; // 综合人气评分
        this.favoriteCount = favoriteCount;
        this.shareCount = shareCount;
        this.rating = rating;
      }
    }

    /**
     * 滑雪场聚合根
     */
    class SkiResort {
      constructor(data) {
        this.id = data.id;
        this.name = data.name;
        this.nameEn = data.nameEn || '';

        // 位置信息
        this.location = new Location(
          data.country,
          data.province,
          data.city,
          data.address,
          data.coordinates
        );

        // 类型
        this.type = data.type; // 'indoor' | 'outdoor'

        // 营业信息
        this.openTime = data.openTime || '09:00-17:00';
        this.season = data.season || (this.type === 'indoor' ? '全年开放' : '11月-3月');
        this.ticketPrice = new Price(
          data.priceMin || data.price || 0,
          data.priceMax || data.price || 0,
          data.priceUnit || '天'
        );

        // 设施
        this.facilities = new Facilities(
          data.trails || { total: 0, beginner: 0, intermediate: 0, advanced: 0 },
          data.elevation || { min: 0, max: 0, drop: 0 },
          data.lifts || 0
        );

        // 社交
        this.social = new SocialInfo(
          data.popularityScore || 0,
          data.favoriteCount || 0,
          data.shareCount || 0,
          data.rating || 4.5
        );

        // 距离（动态计算）
        this.distance = data.distance || null; // 单位：km

        // 数据来源
        this.source = data.source || 'preset'; // 'preset' | 'amap'

        // 原始POI数据（如果来自高德）
        this.poi = data.poi || null;
      }

      // 判断是否是室内滑雪场
      isIndoor() {
        return this.type === 'indoor';
      }

      // 判断是否是室外滑雪场
      isOutdoor() {
        return this.type === 'outdoor';
      }

      // 获取距离文本
      getDistanceText() {
        if (!this.distance) return '';
        if (this.distance < 1) {
          return `${Math.round(this.distance * 1000)}m`;
        }
        return `${Math.round(this.distance)}km`;
      }
    }

    // ========================================
    // 应用服务层
    // ========================================

    /**
     * 搜索服务 - 负责搜索相关度计算（逻辑内聚）
     */
    class SearchService {
      /**
       * 计算搜索相关度（综合指标）
       * 当前策略：距离权重较高
       * 后续可扩展：名称匹配度、人气评分等
       */
      static calculateRelevance(resort, searchContext) {
        const factors = [];

        // 因子1：距离（权重0.6）
        if (searchContext.userLocation && resort.distance !== null) {
          const distanceScore = Math.max(0, 1 - resort.distance / 500); // 500km内线性衰减
          factors.push({ name: 'distance', score: distanceScore, weight: 0.6 });
        }

        // 因子2：名称匹配度（权重0.3）
        if (searchContext.keyword && resort.name.includes(searchContext.keyword)) {
          factors.push({ name: 'nameMatch', score: 1, weight: 0.3 });
        } else if (searchContext.keyword) {
          factors.push({ name: 'nameMatch', score: 0, weight: 0.3 });
        }

        // 因子3：人气评分（权重0.1）
        const popularityScore = resort.social.popularityScore / 100;
        factors.push({ name: 'popularity', score: popularityScore, weight: 0.1 });

        // 计算加权总分
        let totalScore = 0;
        let totalWeight = 0;

        factors.forEach(factor => {
          totalScore += factor.score * factor.weight;
          totalWeight += factor.weight;
        });

        return {
          score: totalWeight > 0 ? totalScore / totalWeight : 0,
          factors: factors
        };
      }
    }

    /**
     * 排序服务 - 负责人气排序（逻辑内聚）
     */
    class RankingService {
      /**
       * 计算人气评分（综合指标）
       * 当前策略：搜索量为主
       * 后续可扩展：打卡量、评论量、收藏量等
       */
      static calculatePopularityScore(resort) {
        const factors = {
          searchVolume: resort.social.favoriteCount * 1.0, // 搜索量/收藏量
          shareCount: resort.social.shareCount * 0.5,     // 分享数
          rating: resort.social.rating * 10               // 评分
        };

        // 综合计算（后续可调整权重）
        const score = factors.searchVolume + factors.shareCount + factors.rating;

        return Math.round(score * 10) / 10; // 保留1位小数
      }
    }

    // ========================================
    // 基础设施层
    // ========================================

    /**
     * 高德地图仓库
     */
    class AmapRepository {
      constructor() {
        this.apiKey = '41f98310392808752b5e9ea1e6bc4776';
        this.poiType = '080107'; // 滑雪场分类代码
      }

      /**
       * 搜索滑雪场（使用POI分类代码）
       */
      async searchSkiResorts(city) {
        try {
          const url = `https://restapi.amap.com/v5/place/text?key=${this.apiKey}&keywords=滑雪场&types=${this.poiType}&city=${city}&citylimit=true&offset=50&page=1&extensions=all`;

          const response = await fetch(url);
          const data = await response.json();

          if (data.pois) {
            return data.pois.map(poi => this.transformToSkiResort(poi, city));
          }

          return [];
        } catch (error) {
          console.error('高德API搜索失败:', error);
          throw error;
        }
      }

      /**
       * 地理编码（城市 → 坐标）
       */
      async geocode(city) {
        try {
          const url = `https://restapi.amap.com/v3/geocode/geo?key=${this.apiKey}&address=${encodeURIComponent(city)}`;
          const response = await fetch(url);
          const data = await response.json();

          if (data.geocodes && data.geocodes.length > 0) {
            const [longitude, latitude] = data.geocodes[0].location.split(',').map(parseFloat);
            return {
              longitude,
              latitude,
              city: data.geocodes[0].city
            };
          }

          return null;
        } catch (error) {
          console.error('地理编码失败:', error);
          return null;
        }
      }

      /**
       * 将高德POI转换为滑雪场实体
       */
      transformToSkiResort(poi, city) {
        const [longitude, latitude] = poi.location.split(',').map(parseFloat);

        // 判断室内/室外（基于高德标签和名称）
        let type = 'outdoor';
        if (poi.type === '080107') {
          // 根据名称判断
          const indoorKeywords = ['室内', '融创', '乔波', '冰雪世界', '热雪奇迹', '雪乐山'];
          type = indoorKeywords.some(k => poi.name.includes(k)) ? 'indoor' : 'outdoor';
        }

        return new SkiResort({
          id: poi.id,
          name: poi.name,
          nameEn: '',
          country: '中国',
          province: poi.pname || '',
          city: poi.cityname || city,
          address: poi.address || '',
          coordinates: { lat: latitude, lng: longitude },
          type: type,
          openTime: '09:00-17:00',
          season: type === 'indoor' ? '全年开放' : '11月-3月',
          price: type === 'indoor' ? 468 : 680,
          priceUnit: type === 'indoor' ? '4小时' : '天',
          trails: { total: 0, beginner: 0, intermediate: 0, advanced: 0 },
          elevation: { min: 0, max: 0, drop: 0 },
          lifts: 0,
          popularityScore: 0,
          favoriteCount: 0,
          shareCount: 0,
          rating: 4.5,
          source: 'amap',
          poi: poi
        });
      }
    }

          shareCount: Math.floor(data.popularityScore * 5 + Math.random() * 30),
          source: 'preset'
        }));
      }

      /**
       * 获取热门滑雪场
       */
      getPopularResorts() {
        return this.presets.map(data => new SkiResort(data));
      }
    }

    // ========================================
    // 应用层 - 应用服务
    // ========================================

    /**
     * 滑雪场应用服务
     */
    class SkiResortService {
      constructor() {
        this.amapRepo = new AmapRepository();
        this.localRepo = new LocalRepository();
        this.currentResorts = [];
        this.currentFilter = 'all';
        this.userLocation = null; // { lat, lng }
        this.searchKeyword = '';
        this.favorites = new Set();

        // 加载收藏列表
        this.loadFavorites();
      }

      /**
       * 初始化 - 加载热门滑雪场
       */
      async initialize() {
        const popularResorts = this.localRepo.getPopularResorts();

        // 计算人气评分
        popularResorts.forEach(resort => {
          resort.social.popularityScore = RankingService.calculatePopularityScore(resort);
        });

        // 按人气排序
        popularResorts.sort((a, b) => b.social.popularityScore - a.social.popularityScore);

        this.currentResorts = popularResorts;
        return popularResorts;
      }

      /**
       * 搜索滑雪场
       */
      async search(keyword) {
        this.searchKeyword = keyword;

        if (!keyword || keyword.trim() === '') {
          // 空搜索：返回热门滑雪场
          return await this.initialize();
        }

        // 获取用户位置（用于计算距离）
        if (!this.userLocation) {
          const cityCoords = await this.amapRepo.geocode(keyword);
          if (cityCoords) {
            this.userLocation = { lat: cityCoords.latitude, lng: cityCoords.longitude };
          }
        }

        try {
          // 从高德API搜索
          const amapResorts = await this.amapRepo.searchSkiResorts(keyword);

          // 合并预设数据和高德数据
          const allResorts = [...this.localRepo.getPopularResorts(), ...amapResorts];

          // 去重（基于ID）
          const uniqueResorts = this.deduplicateResorts(allResorts);

          // 计算距离
          if (this.userLocation) {
            uniqueResorts.forEach(resort => {
              resort.distance = this.calculateDistance(
                this.userLocation.lat,
                this.userLocation.lng,
                resort.location.coordinates.lat,
                resort.location.coordinates.lng
              );
            });
          }

          // 计算相关度并排序
          const searchContext = {
            keyword: keyword,
            userLocation: this.userLocation
          };

          uniqueResorts.forEach(resort => {
            const relevance = SearchService.calculateRelevance(resort, searchContext);
            resort._relevanceScore = relevance.score;
          });

          // 按相关度排序
          uniqueResorts.sort((a, b) => b._relevanceScore - a._relevanceScore);

          this.currentResorts = uniqueResorts;
          return uniqueResorts;
        } catch (error) {
          console.error('搜索失败:', error);
          // 失败时返回预设数据
          return await this.initialize();
        }
      }

      /**
       * 筛选滑雪场
       */
      filterByType(type) {
        this.currentFilter = type;

        if (type === 'all') {
          return this.currentResorts;
        }

        return this.currentResorts.filter(resort => resort.type === type);
      }

      /**
       * 切换收藏状态
       */
      toggleFavorite(resortId) {
        if (this.favorites.has(resortId)) {
          this.favorites.delete(resortId);
        } else {
          this.favorites.add(resortId);
        }

        this.saveFavorites();
        return this.favorites.has(resortId);
      }

      /**
       * 检查是否已收藏
       */
      isFavorite(resortId) {
        return this.favorites.has(resortId);
      }

      /**
       * 加载收藏列表
       */
      loadFavorites() {
        try {
          const saved = localStorage.getItem('ski_resort_favorites');
          if (saved) {
            this.favorites = new Set(JSON.parse(saved));
          }
        } catch (error) {
          console.error('加载收藏失败:', error);
        }
      }

      /**
       * 保存收藏列表
       */
      saveFavorites() {
        try {
          localStorage.setItem('ski_resort_favorites', JSON.stringify([...this.favorites]));
        } catch (error) {
          console.error('保存收藏失败:', error);
        }
      }

      /**
       * 去重滑雪场
       */
      deduplicateResorts(resorts) {
        const seen = new Set();
        return resorts.filter(resort => {
          if (seen.has(resort.id)) {
            return false;
          }
          seen.add(resort.id);
          return true;
        });
      }

      /**
       * 计算距离（Haversine公式）
       */
      calculateDistance(lat1, lng1, lat2, lng2) {
        const R = 6371; // 地球半径（km）
        const dLat = (lat2 - lat1) * Math.PI / 180;
        const dLng = (lng2 - lng1) * Math.PI / 180;
        const a = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
                  Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                  Math.sin(dLng / 2) * Math.sin(dLng / 2);
        const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
        return R * c;
      }
    }

    // ========================================
    // 展示层 - UI渲染
    // ========================================

    const skiResortService = new SkiResortService();
    let searchTimeout = null;

    // 初始化
    async function init() {
      showLoading();
      const resorts = await skiResortService.initialize();
      renderResorts(resorts);
    }

    // 渲染滑雪场列表
    function renderResorts(resorts) {
      const container = document.getElementById('resortList');
      const statusBar = document.getElementById('statusBar');

      if (resorts.length === 0) {
        container.innerHTML = `
          <div class="empty-state">
            <div class="empty-icon">🔍</div>
            <div>没有找到相关滑雪场</div>
            <div style="font-size: 12px; margin-top: 8px;">试试搜索其他城市</div>
          </div>
        `;
        return;
      }

      // 更新状态栏
      if (skiResortService.searchKeyword) {
        statusBar.innerHTML = `🏂 找到 ${resorts.length} 个滑雪场`;
      } else {
        statusBar.innerHTML = `🏂 国内热门滑雪场（共${resorts.length}个）`;
      }

      container.innerHTML = resorts.map((resort, index) => `
        <div class="resort-card" onclick="showDetail('${resort.id}')">
          <div class="resort-image" style="background: linear-gradient(135deg, ${getColor(index)} 0%, ${getColor(index + 1)} 100%);">
            <span class="resort-type-badge ${resort.type === 'indoor' ? 'badge-indoor' : 'badge-outdoor'}">
              ${resort.type === 'indoor' ? '室内' : '室外'}
            </span>
            ${resort.distance ? `<span class="resort-rank">📍 ${resort.getDistanceText()}</span>` : ''}
            ${!resort.distance && resort.social.popularityScore >= 80 ? `<span class="resort-rank">🔥 人气 TOP ${index + 1}</span>` : ''}
          </div>
          <div class="resort-info">
            <div class="resort-header">
              <div class="resort-name">${resort.name}</div>
            </div>
            <div class="resort-location">
              📍 ${resort.location.city}, ${resort.location.province}
            </div>
            <div class="resort-meta">
              <div class="meta-item">⭐ ${resort.social.rating}</div>
              <div class="meta-item">🎿 ${resort.facilities.trails.total}条雪道</div>
              <div class="meta-item">⛰️ ${resort.facilities.elevation.max}m</div>
            </div>
            <div class="resort-stats">
              <div class="stat-item">
                <span class="stat-value">${resort.facilities.trails.beginner}</span>
                <span class="stat-label">初级</span>
              </div>
              <div class="stat-item">
                <span class="stat-value">${resort.facilities.trails.intermediate}</span>
                <span class="stat-label">中级</span>
              </div>
              <div class="stat-item">
                <span class="stat-value">${resort.facilities.trails.advanced}</span>
                <span class="stat-label">高级</span>
              </div>
            </div>
            <div class="resort-price">
              <span class="price-value">${resort.ticketPrice.displayText}</span>
              <button
                class="favorite-btn ${skiResortService.isFavorite(resort.id) ? 'active' : ''}"
                onclick="event.stopPropagation(); toggleFavorite('${resort.id}')"
              >
                <span>${skiResortService.isFavorite(resort.id) ? '❤️' : '🤍'}</span>
                ${skiResortService.isFavorite(resort.id) ? '已收藏' : '收藏'}
              </button>
            </div>
          </div>
        </div>
      `).join('');
    }

    // 显示详情
    function showDetail(resortId) {
      const resort = skiResortService.currentResorts.find(r => r.id === resortId);
      if (!resort) return;

      const modal = document.getElementById('detailModal');
      const modalBody = document.getElementById('modalBody');

      modalBody.innerHTML = `
        <div class="detail-section">
          <h2 style="font-size: 20px; font-weight: bold; margin-bottom: 12px;">${resort.name}</h2>
          <div style="font-size: 13px; color: #666; margin-bottom: 16px;">
            📍 ${resort.location.fullName} | ${resort.type === 'indoor' ? '室内' : '室外'}
          </div>
        </div>

        <div class="detail-section">
          <div class="detail-title">🎫 营业信息</div>
          <div class="detail-item">
            <span class="detail-label">开放时间</span>
            <span class="detail-value">${resort.openTime}</span>
          </div>
          <div class="detail-item">
            <span class="detail-label">开放季节</span>
            <span class="detail-value">${resort.season}</span>
          </div>
          <div class="detail-item">
            <span class="detail-label">门票价格</span>
            <span class="detail-value">${resort.ticketPrice.displayText}</span>
          </div>
        </div>

        <div class="detail-section">
          <div class="detail-title">🎿 雪道设施</div>
          <div class="detail-item">
            <span class="detail-label">雪道总数</span>
            <span class="detail-value">${resort.facilities.trails.total}条</span>
          </div>
          <div class="detail-item">
            <span class="detail-label">雪道分布</span>
            <span class="detail-value">${resort.facilities.trailDistribution}</span>
          </div>
          <div class="detail-item">
            <span class="detail-label">海拔落差</span>
            <span class="detail-value">${resort.facilities.elevation.min}m - ${resort.facilities.elevation.max}m（落差${resort.facilities.elevation.drop}m）</span>
          </div>
        </div>

        <div class="detail-section">
          <div class="detail-title">⭐ 社交信息</div>
          <div class="detail-item">
            <span class="detail-label">人气评分</span>
            <span class="detail-value">${resort.social.popularityScore}</span>
          </div>
          <div class="detail-item">
            <span class="detail-label">用户评分</span>
            <span class="detail-value">${resort.social.rating}</span>
          </div>
        </div>

        ${resort.distance ? `
        <div class="detail-section">
          <div class="detail-title">📍 距离信息</div>
          <div class="detail-item">
            <span class="detail-label">距离</span>
            <span class="detail-value">${resort.getDistanceText()}</span>
          </div>
        </div>
        ` : ''}
      `;

      modal.classList.add('active');
    }

    // 关闭详情
    function closeModal() {
      document.getElementById('detailModal').classList.remove('active');
    }

    // 切换收藏
    async function toggleFavorite(resortId) {
      const isFav = skiResortService.toggleFavorite(resortId);

      // 更新按钮状态
      const btn = event.target.closest('.favorite-btn');
      if (isFav) {
        btn.classList.add('active');
        btn.innerHTML = '<span>❤️</span> 已收藏';
      } else {
        btn.classList.remove('active');
        btn.innerHTML = '<span>🤍</span> 收藏';
      }
    }

    // 筛选类型
    async function filterByType(type) {
      // 更新按钮状态
      document.querySelectorAll('.filter-tag').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.type === type);
      });

      // 筛选并渲染
      const filtered = skiResortService.filterByType(type);
      renderResorts(filtered);
    }

    // 获取颜色
    function getColor(index) {
      const colors = [
        '#667eea', '#764ba2', '#f093fb', '#4facfe', '#43e97b',
        '#fa709a', '#fee140', '#30cfd0', '#a8edea', '#fed6e3'
      ];
      return colors[index % colors.length];
    }

    // 显示加载
    function showLoading() {
      document.getElementById('resortList').innerHTML = `
        <div class="loading">
          <div class="loading-spinner"></div>
          <div style="margin-top: 16px;">加载中...</div>
        </div>
      `;
    }

    // ========================================
    // 事件监听
    // ========================================

    // 搜索输入
    document.getElementById('searchInput').addEventListener('input', (e) => {
      clearTimeout(searchTimeout);
      const keyword = e.target.value.trim();

      searchTimeout = setTimeout(async () => {
        if (keyword === '') {
          // 空搜索：显示热门
          skiResortService.searchKeyword = '';
          skiResortService.userLocation = null;
          const resorts = await skiResortService.initialize();
          filterByType(skiResortService.currentFilter);
        } else {
          // 有关键词：搜索
          showLoading();
          const resorts = await skiResortService.search(keyword);
          filterByType(skiResortService.currentFilter);
        }
      }, 500);
    });

    // 筛选按钮
    document.querySelectorAll('.filter-tag').forEach(btn => {
      btn.addEventListener('click', () => {
        filterByType(btn.dataset.type);
      });
    });

    // 点击遮罩关闭弹窗
    document.getElementById('detailModal').addEventListener('click', (e) => {
      if (e.target.id === 'detailModal') {
        closeModal();
      }
    });

    // 页面加载完成
    window.addEventListener('DOMContentLoaded', init);
  </script>
</body>
